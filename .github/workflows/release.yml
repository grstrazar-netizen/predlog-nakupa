name: Publish downloadable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npm run build

      - name: Prepare local package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE="center-rog-evidence-${RELEASE_TAG}-lokalna"
          mkdir -p "release-output/${PACKAGE}/dist"
          cp -R dist/. "release-output/${PACKAGE}/dist/"
          cp server.mjs "release-output/${PACKAGE}/server.mjs"
          cp release/PREBERI-ME.txt "release-output/${PACKAGE}/PREBERI-ME.txt"
          cp release/ZAZENI-MAC.command "release-output/${PACKAGE}/ZAZENI-MAC.command"
          cp release/ZAZENI-WINDOWS.bat "release-output/${PACKAGE}/ZAZENI-WINDOWS.bat"
          chmod +x "release-output/${PACKAGE}/ZAZENI-MAC.command"
          cd release-output
          zip -r "${PACKAGE}.zip" "${PACKAGE}"
          sha256sum "${PACKAGE}.zip" > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "release-output/center-rog-evidence-${RELEASE_TAG}-lokalna.zip" \
            "release-output/SHA256SUMS.txt" \
            --title "Center Rog evidence ${RELEASE_TAG}" \
            --generate-notes
